[package]
name = "rust-a11y-agent"
version = "0.1.0"
edition = "2021"
description = "Agente de IA em Rust para acessibilidade cognitiva com ponte MCP"
license = "MIT"
readme = "README.md"

[[bin]]
name = "rust-a11y-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dialoguer = "0.12"
async-trait = "0.1"
schemars = "1.0"
axum = "0.8"
getrandom = "0.4"
futures = "0.3"
tokio-stream = "0.1"
walkdir = "2"
glob = "0.3"
regex = "1"
rmcp = { version = "3.8", features = [
    "server",
    "client",
    "macros",
    "schemars",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest",
] }
